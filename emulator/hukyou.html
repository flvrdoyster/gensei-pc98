<body>

  <div class="top-bar">
    <img src="img/logo-hukyou.png" alt="환세풍광전" class="logo">
    <div class="top-bar-right">
      <button id="btn-gamepad" class="btn-icon btn-touch-only" title="게임패드" data-icon="gamepad"></button>
      <button id="btn-mute" class="btn-icon" title="음소거" style="display:none" data-icon="mute"></button>
      <button id="btn-fullscreen" class="btn-icon" title="전체화면" data-icon="fullscreen"></button>
      <button id="btn-collapse" class="btn-icon" title="상단바 숨기기" data-icon="collapse"></button>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <button id="btn-start">▶ 시작</button>
    </div>
    <div id="toast"></div>
  </div>

  <p class="hint">화면을 클릭한 뒤 키보드로 조작 · 이동: 방향키, 결정: Enter/Space, 취소: ESC/Shift</p>

  <div id="virtual-gamepad">
    <div class="gamepad-dpad">
      <button data-key="ArrowUp" class="dpad-up" data-icon="dpadUp"></button>
      <button data-key="ArrowLeft" class="dpad-left" data-icon="dpadLeft"></button>
      <button data-key="ArrowRight" class="dpad-right" data-icon="dpadRight"></button>
      <button data-key="ArrowDown" class="dpad-down" data-icon="dpadDown"></button>
    </div>
    <div class="gamepad-buttons">
      <button data-key="Escape" data-icon="escKey"></button>
      <button class="gamepad-btn-enter" data-key="Enter" data-icon="enterKey"></button>
    </div>
  </div>
  <script src="icons.js"></script>
  <script src="audio.js"></script>
  <script src="gamepad.js"></script>
  <script src="debug.js"></script>
  <script src="feedback.js"></script>

  <script>
    window.GAME = 'hukyou';
    function track(name) { (window.dataLayer = window.dataLayer || []).push({ event: name, game: window.GAME }); }
    const DISK    = '/rom/hukyou_kr.fdi';
    const IDB_NAME  = 'gensei-saves';
    const IDB_STORE = 'disks';
    const IDB_KEY   = 'hukyou_kr.fdi';
    const POLL_MS   = 10000;

    // Toast messages
    const MSG = {
      SAVE_RESTORED:  '세이브 데이터를 복원했습니다.',
      SAVE_SAVED:     '세이브 데이터가 저장되었습니다.',
      DISK_TIMEOUT:   '디스크 마운트에 실패해 원본으로 시작합니다.',
      JS_LOAD_FAIL:   '에뮬레이터를 불러오지 못했습니다.',
      FULLSCREEN_ESC: 'ESC를 길게 눌러 전체화면을 해제합니다.',
    };

    const canvas  = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');
    const toast   = document.getElementById('toast');

    const logs = [];
    let toastTimer = null;

    function log(msg) {
      logs.push('[' + new Date().toLocaleTimeString() + '] ' + msg);
    }

    function showToast(msg, duration = 2000) {
      log(msg);
      toast.textContent = msg;
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('visible'), duration);
    }

    // IndexedDB helpers
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    function idbGet(db, key) {
      return new Promise((resolve, reject) => {
        const req = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(key);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    function idbPut(db, key, value) {
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(IDB_STORE, 'readwrite');
        const req = tx.objectStore(IDB_STORE).put(value, key);
        req.onsuccess = () => resolve();
        req.onerror   = e => reject(e.target.error);
      });
    }

    // 체크섬 (변경 감지용)
    function checksum(arr) {
      let s = 0;
      for (let i = 0; i < arr.length; i++) s = (s + arr[i]) >>> 0;
      return s;
    }

    let db = null;
    let lastChecksum = null;
    let pollTimer = null;
    let savedOnce = false;     // save_created 이벤트 세션당 1회 가드

    async function saveDisk() {
      if (!db) return;
      try {
        const data = Module.FS.readFile(DISK);
        const csum = checksum(data);
        if (csum === lastChecksum) return;
        await idbPut(db, IDB_KEY, data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength));
        lastChecksum = csum;
        log('[save] 세이브 동기화 완료');
        showToast(MSG.SAVE_SAVED);
        if (!savedOnce) { savedOnce = true; track('save_created'); }
      } catch (e) {
        log('[save] 오류: ' + e);
      }
    }

    function startPolling() {
      pollTimer = setInterval(saveDisk, POLL_MS);
    }

    document.getElementById('btn-start').addEventListener('click', function() {
      overlay.classList.add('hidden');
      track('emulator_start');
      startEmulator();
    });

    document.getElementById('btn-fullscreen').addEventListener('click', async () => {
      const wrap = document.getElementById('canvas-wrap');
      await (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
      // 전체화면 중 짧은 ESC는 에뮬레이터로 전달하고, 길게 눌러야 해제(Keyboard Lock, Chrome/Edge).
      if (navigator.keyboard && navigator.keyboard.lock) {
        try { await navigator.keyboard.lock(['Escape']); } catch (e) {}
      }
    });
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && navigator.keyboard && navigator.keyboard.unlock) {
        navigator.keyboard.unlock();
      }
    });
    // 전체화면 중 ESC를 누를 때마다(짧게 눌러 페이지로 전달된 경우) 안내 토스트
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.fullscreenElement) showToast(MSG.FULLSCREEN_ESC);
    });

    async function startEmulator() {
      db = await openDB().catch(e => { log('[idb] 오류: ' + e); return null; });

      // IDB에서 저장된 디스크 복원
      let savedDisk = null;
      if (db) {
        savedDisk = await idbGet(db, IDB_KEY).catch(() => null);
        if (savedDisk) log('[save] 저장된 세이브 데이터 발견');
      }

      window.Module = {
        canvas: canvas,
        arguments: [DISK],

        preRun: [function() {
          Module.addRunDependency('disk-setup');
          var attempts = 0;
          function trySetup() {
            try {
              Module.FS.stat(DISK);
              Module.FS.chmod(DISK, 0o666);
              if (savedDisk) {
                Module.FS.writeFile(DISK, new Uint8Array(savedDisk));
              }
              Module.removeRunDependency('disk-setup');
            } catch(e) {
              if (++attempts < 200) {
                setTimeout(trySetup, 10);
              } else {
                log(MSG.DISK_TIMEOUT);
                Module.removeRunDependency('disk-setup');
              }
            }
          }
          setTimeout(trySetup, 0);
        }],

        postRun: [function() {
          document.title = '환세풍광전 : atah.io';
          lastChecksum = checksum(Module.FS.readFile(DISK));
          startPolling();
          showToast(savedDisk ? MSG.SAVE_RESTORED : '에뮬레이터를 불러왔습니다.');
          if (savedDisk) track('save_restored');
        }],

        print:    t => log('[out] ' + t),
        printErr: t => log('[err] ' + t),

        setStatus(text) {
          if (text) log(text);
        },

        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
        }
      };

      const s = document.createElement('script');
      s.src = 'hukyou.js';
      s.onerror = () => { showToast(MSG.JS_LOAD_FAIL, 5000); track('load_failed'); };
      document.body.appendChild(s);
    }
  </script>
  <script src="https://atah.io/footer.js" data-emulator></script>
  <script src="version.js"></script>
</body>
</html>
