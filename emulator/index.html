<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>환세풍광전 웹 버전 : atah.io</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://atah.io/favicon.ico">
</head>
<body>
  <h1>환세풍광전</h1>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <button id="btn-start">▶ 시작</button>
    </div>
    <div id="toast"></div>
  </div>

  <div class="controls">
    <button id="btn-fullscreen">⛶ 전체화면</button>
    <button id="btn-copylog">📋 로그 복사</button>
  </div>

  <p class="hint">화면을 클릭하면 마우스/키보드 캡처 &nbsp;|&nbsp; ESC → 해제</p>

  <script>
    const DISK = '/rom/hukyou_kr.fdi';

    const canvas  = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');
    const toast   = document.getElementById('toast');

    const logs = [];
    let toastTimer = null;

    function log(msg) {
      logs.push('[' + new Date().toLocaleTimeString() + '] ' + msg);
    }

    function showToast(msg, duration = 2000) {
      log(msg);
      toast.textContent = msg;
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('visible'), duration);
    }

    document.getElementById('btn-copylog').addEventListener('click', () => {
      if (logs.length === 0) { alert('로그 없음'); return; }
      navigator.clipboard.writeText(logs.join('\n')).then(() => {
        const btn = document.getElementById('btn-copylog');
        const orig = btn.textContent;
        btn.textContent = '✓ 복사됨';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      });
    });

    document.getElementById('btn-start').addEventListener('click', function() {
      overlay.classList.add('hidden');
      startEmulator();
    });

    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      const wrap = document.getElementById('canvas-wrap');
      (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
    });

    function startEmulator() {
      window.Module = {
        canvas: canvas,
        arguments: [DISK],

        postRun: [function() {
          document.title = '환세풍광전 웹 버전 : atah.io';
          showToast('초기화 완료');
        }],

        print:    t => log('[out] ' + t),
        printErr: t => log('[err] ' + t),

        setStatus(text) {
          if (text) showToast(text);
        },

        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
        }
      };

      const s = document.createElement('script');
      s.src = 'emnp2kai_sdl2.js';
      s.onerror = () => { showToast('JS 로드 실패', 5000); };
      document.body.appendChild(s);
    }
  </script>
  <script src="https://atah.io/footer.js"></script>
</body>
</html>
