<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>NP2kai - 환세풍광전</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #ccc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      gap: 12px;
    }
    h1 { font-size: 1.1em; color: #aaa; margin-top: 8px; }
    #canvas-wrap {
      position: relative;
      display: inline-block;
      border: 2px solid #444;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      /* SDL이 inline style로 height를 400px로 덮어씀 →
         JS MutationObserver로 480px 재적용 (4:3 보정) */
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #eee;
    }
    #overlay.hidden { display: none; }
    #overlay button {
      font-size: 1.1em;
      padding: 10px 28px;
      background: #333;
      border: 1px solid #666;
      color: #eee;
      cursor: pointer;
    }
    #overlay button:hover { background: #444; }
    #status { font-size: 0.85em; color: #888; min-height: 1.2em; }
    #log {
      width: 640px;
      height: 80px;
      background: #111;
      border: 1px solid #333;
      padding: 6px;
      font-size: 0.75em;
      overflow-y: auto;
      color: #777;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    button {
      background: #333;
      border: 1px solid #555;
      color: #ccc;
      padding: 6px 14px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.85em;
    }
    button:hover { background: #444; }
    button:disabled { opacity: 0.4; cursor: default; }
    .hint { font-size: 0.75em; color: #555; }
  </style>
</head>
<body>
  <h1>NP2kai — 환세풍광전 (한국어)</h1>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div>환세풍광전 한국어 번역 테스트</div>
      <button id="btn-start">▶ 시작</button>
    </div>
  </div>

  <div id="status">대기 중...</div>

  <div class="controls">
    <button id="btn-reset" disabled>⟳ 리셋</button>
    <button id="btn-fullscreen">⛶ 전체화면</button>
  </div>

  <div id="log"></div>
  <p class="hint">클릭 → 마우스/키보드 캡처 &nbsp;|&nbsp; ESC → 해제</p>

  <script>
    // 디스크 구성 (나중에 멀티 디스크 확장 가능)
    const DISKS = [
      '/rom/hukyou_kr.fdi',
    ];

    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');

    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const btnReset = document.getElementById('btn-reset');

    function log(msg) {
      const line = document.createElement('div');
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    document.getElementById('btn-start').addEventListener('click', function() {
      overlay.classList.add('hidden');
      statusEl.textContent = 'WASM 로드 중...';
      log('에뮬레이터 시작 (' + DISKS[0] + ')');
      startEmulator();
    });

    btnReset.addEventListener('click', function() {
      log('리셋');
      // np2kai는 메뉴를 통한 리셋만 지원 — F12 키 이벤트로 대체 가능
    });

    document.getElementById('btn-fullscreen').addEventListener('click', function() {
      const wrap = document.getElementById('canvas-wrap');
      (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
    });

    function startEmulator() {
      window.Module = {
        canvas: canvas,
        arguments: DISKS,   // FDI 경로들을 argv로 전달

        postRun: [function() {
          log('초기화 완료');
          statusEl.textContent = '실행 중';
          btnReset.disabled = false;
        }],

        print:    function(t) { log('[out] ' + t); },
        printErr: function(t) { log('[err] ' + t); },

        setStatus: function(text) {
          if (text) { statusEl.textContent = text; }
        },

        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          statusEl.textContent = left
            ? '로딩 ' + (this.totalDependencies - left) + '/' + this.totalDependencies
            : '실행 준비 완료';
        }
      };

      const s = document.createElement('script');
      s.src = 'emnp2kai_sdl2.js';
      s.onerror = () => { log('JS 로드 실패'); statusEl.textContent = '로드 실패'; };
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
