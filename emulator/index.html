<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>NP2kai - 환세풍광전</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>NP2kai — 환세풍광전 (한국어)</h1>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div>환세풍광전 한국어 번역 테스트</div>
      <button id="btn-start">▶ 시작</button>
    </div>
  </div>

  <div id="status">대기 중...</div>

  <div class="controls">
    <button id="btn-fullscreen">⛶ 전체화면</button>
    <button id="btn-copylog">📋 로그 복사</button>
  </div>

  <p class="hint">클릭 → 마우스/키보드 캡처 &nbsp;|&nbsp; ESC → 해제</p>

  <script>
    const DISK = '/rom/hukyou_kr.fdi';

    const canvas   = document.getElementById('canvas');
    const overlay  = document.getElementById('overlay');
    const statusEl = document.getElementById('status');

    const logs = [];

    function log(msg) {
      logs.push('[' + new Date().toLocaleTimeString() + '] ' + msg);
    }

    document.getElementById('btn-copylog').addEventListener('click', () => {
      if (logs.length === 0) { alert('로그 없음'); return; }
      navigator.clipboard.writeText(logs.join('\n')).then(() => {
        const btn = document.getElementById('btn-copylog');
        const orig = btn.textContent;
        btn.textContent = '✓ 복사됨';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      });
    });

    document.getElementById('btn-start').addEventListener('click', function() {
      overlay.classList.add('hidden');
      log('에뮬레이터 시작');
      startEmulator();
    });

    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      const wrap = document.getElementById('canvas-wrap');
      (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
    });

    function startEmulator() {
      window.Module = {
        canvas: canvas,
        arguments: [DISK],

        postRun: [function() {
          log('초기화 완료');
          statusEl.textContent = '실행 중';
        }],

        print:    t => log('[out] ' + t),
        printErr: t => log('[err] ' + t),

        setStatus(text) {
          if (text) statusEl.textContent = text;
        },

        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          statusEl.textContent = left
            ? '로딩 ' + (this.totalDependencies - left) + '/' + this.totalDependencies
            : '실행 준비 완료';
        }
      };

      const s = document.createElement('script');
      s.src = 'emnp2kai_sdl2.js';
      s.onerror = () => { log('JS 로드 실패'); };
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
