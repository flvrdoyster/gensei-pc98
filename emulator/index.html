<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>NP2kai - 환세풍광전</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #ccc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      gap: 12px;
    }
    h1 { font-size: 1.1em; color: #aaa; margin-top: 8px; }
    #canvas-wrap {
      position: relative;
      display: inline-block;
      border: 2px solid #444;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      /* 640×400 고정. 스케일 필요 시 transform만 사용 */
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #eee;
    }
    #overlay.hidden { display: none; }
    #overlay button {
      font-size: 1.1em;
      padding: 10px 28px;
      background: #333;
      border: 1px solid #666;
      color: #eee;
      cursor: pointer;
      font-family: monospace;
    }
    #overlay button:hover { background: #444; }
    #status { font-size: 0.85em; color: #888; min-height: 1.2em; }
    #log {
      width: 640px;
      height: 80px;
      background: #111;
      border: 1px solid #333;
      padding: 6px;
      font-size: 0.75em;
      overflow-y: auto;
      color: #777;
    }
    .controls { display: flex; gap: 8px; }
    button {
      background: #333;
      border: 1px solid #555;
      color: #ccc;
      padding: 6px 14px;
      cursor: pointer;
      font-family: monospace;
      font-size: 0.85em;
    }
    button:hover { background: #444; }
    .hint { font-size: 0.75em; color: #555; }
  </style>
</head>
<body>
  <h1>NP2kai — 환세풍광전 (한국어)</h1>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div>환세풍광전 한국어 번역 테스트</div>
      <button id="btn-start">▶ 시작</button>
    </div>
  </div>

  <div id="status">대기 중...</div>

  <div class="controls">
    <button id="btn-fullscreen">⛶ 전체화면</button>
  </div>

  <div id="log"></div>
  <p class="hint">클릭 → 마우스/키보드 캡처 &nbsp;|&nbsp; ESC → 해제</p>

  <script>
    const DISK = '/rom/hukyou_kr.fdi';

    const canvas  = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');
    const statusEl = document.getElementById('status');
    const logEl   = document.getElementById('log');

    function log(msg) {
      const d = document.createElement('div');
      d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    document.getElementById('btn-start').addEventListener('click', function() {
      overlay.classList.add('hidden');
      log('에뮬레이터 시작');
      startEmulator();
    });

    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      const wrap = document.getElementById('canvas-wrap');
      (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
    });

    function startEmulator() {
      window.Module = {
        canvas: canvas,
        arguments: [DISK],

        postRun: [function() {
          log('초기화 완료');
          statusEl.textContent = '실행 중';
        }],

        print:    t => log('[out] ' + t),
        printErr: t => log('[err] ' + t),

        setStatus(text) {
          if (text) statusEl.textContent = text;
        },

        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          statusEl.textContent = left
            ? '로딩 ' + (this.totalDependencies - left) + '/' + this.totalDependencies
            : '실행 준비 완료';
        }
      };

      const s = document.createElement('script');
      s.src = 'emnp2kai_sdl2.js';
      s.onerror = () => { log('JS 로드 실패'); };
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
