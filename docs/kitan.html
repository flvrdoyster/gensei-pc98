  <script>
    window.GAME = 'kitan';
    function track(name) { (window.dataLayer = window.dataLayer || []).push({ event: name, game: window.GAME }); }
    const DISKS = ['/rom/kitan-system.fdi', '/rom/kitan-data.fdi'];

    const IDB_NAME  = 'gensei-saves';
    const IDB_STORE = 'disks';
    const POLL_MS   = 10000;

    const MSG = {
      SAVE_RESTORED: '세이브 데이터를 복원했습니다.',
      SAVE_SAVED:    '세이브 데이터가 저장되었습니다.',
      DISK_TIMEOUT:  '디스크 마운트에 실패해 원본으로 시작합니다.',
      JS_LOAD_FAIL:  '에뮬레이터를 불러오지 못했습니다.',
      FULLSCREEN_ESC: 'ESC를 길게 눌러 전체화면을 해제합니다.',
    };

    // 디스크 경로 → IDB 키 (파일명)
    const diskKey = path => path.split('/').pop();

    const canvas  = document.getElementById('canvas');
    const overlay = document.getElementById('overlay');
    const toast   = document.getElementById('toast');

    const logs = [];
    let toastTimer = null;

    function log(msg) {
      logs.push('[' + new Date().toLocaleTimeString() + '] ' + msg);
    }

    function showToast(msg, duration = 2000) {
      log(msg);
      toast.textContent = msg;
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('visible'), duration);
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    function idbGet(db, key) {
      return new Promise((resolve, reject) => {
        const req = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(key);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    function idbPut(db, key, value) {
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(IDB_STORE, 'readwrite');
        const req = tx.objectStore(IDB_STORE).put(value, key);
        req.onsuccess = () => resolve();
        req.onerror   = e => reject(e.target.error);
      });
    }

    // 체크섬 (변경 감지용)
    function checksum(arr) {
      let s = 0;
      for (let i = 0; i < arr.length; i++) s = (s + arr[i]) >>> 0;
      return s;
    }

    let db = null;
    const lastChecksum = {};   // 디스크 경로별 마지막 체크섬
    let pollTimer = null;
    let savedOnce = false;     // save_created 이벤트 세션당 1회 가드

    // 변경된 디스크만 IDB에 저장
    async function saveDisks() {
      if (!db) return;
      let saved = false;
      for (const disk of DISKS) {
        try {
          const data = Module.FS.readFile(disk);
          const csum = checksum(data);
          if (csum === lastChecksum[disk]) continue;
          await idbPut(db, diskKey(disk),
            data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength));
          lastChecksum[disk] = csum;
          log('[save] ' + diskKey(disk) + ' 동기화');
          saved = true;
          if (!savedOnce) { savedOnce = true; track('save_created'); }
        } catch (e) {
          log('[save] 오류(' + diskKey(disk) + '): ' + e);
        }
      }
      if (saved) showToast(MSG.SAVE_SAVED);
    }

    function startPolling() {
      pollTimer = setInterval(saveDisks, POLL_MS);
    }

    document.getElementById('btn-fullscreen').addEventListener('click', async () => {
      const wrap = document.getElementById('canvas-wrap');
      await (wrap.requestFullscreen || wrap.webkitRequestFullscreen).call(wrap);
      // 전체화면 중 짧은 ESC는 에뮬레이터로 전달하고, 길게 눌러야 해제(Keyboard Lock, Chrome/Edge).
      if (navigator.keyboard && navigator.keyboard.lock) {
        try { await navigator.keyboard.lock(['Escape']); } catch (e) {}
      }
    });
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && navigator.keyboard && navigator.keyboard.unlock) {
        navigator.keyboard.unlock();
      }
    });
    // 전체화면 중 ESC를 누를 때마다(짧게 눌러 페이지로 전달된 경우) 안내 토스트
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.fullscreenElement) showToast(MSG.FULLSCREEN_ESC);
    });

    const diskPanel = document.getElementById('disk-panel');
    const btnDisk   = document.getElementById('btn-disk');
    btnDisk.addEventListener('click', () => {
      diskPanel.classList.toggle('hidden');
      btnDisk.classList.toggle('active');
    });

    document.getElementById('btn-start').addEventListener('click', function() {
      overlay.classList.add('hidden');
      track('emulator_start');
      startEmulator();
    });

    async function startEmulator() {
      db = await openDB().catch(e => { log('[idb] 오류: ' + e); return null; });

      // IDB에서 저장된 디스크 복원 데이터 로드
      const saved = {};
      if (db) {
        for (const disk of DISKS) {
          const d = await idbGet(db, diskKey(disk)).catch(() => null);
          if (d) { saved[disk] = d; log('[save] ' + diskKey(disk) + ' 세이브 발견'); }
        }
      }

      window.Module = {
        canvas: canvas,
        arguments: DISKS,

        preRun: [function() {
          Module.addRunDependency('disk-setup');
          var attempts = 0;
          function trySetup() {
            try {
              DISKS.forEach(d => {
                Module.FS.stat(d); Module.FS.chmod(d, 0o666);
                if (saved[d]) Module.FS.writeFile(d, new Uint8Array(saved[d]));
              });
              Module.removeRunDependency('disk-setup');
            } catch(e) {
              if (++attempts < 200) {
                setTimeout(trySetup, 10);
              } else {
                log(MSG.DISK_TIMEOUT);
                Module.removeRunDependency('disk-setup');
              }
            }
          }
          setTimeout(trySetup, 0);
        }],

        postRun: [function() {
          document.title = '환세희담 : atah.io';
          DISKS.forEach(d => { try { lastChecksum[d] = checksum(Module.FS.readFile(d)); } catch(e){} });
          startPolling();
          var restored = Object.keys(saved).length > 0;
          showToast(restored ? MSG.SAVE_RESTORED : '에뮬레이터를 불러왔습니다.');
          if (restored) track('save_restored');
        }],

        print:    t => log('[out] ' + t),
        printErr: t => log('[err] ' + t),

        setStatus(text) {
          if (text) log(text);
        },

        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
        }
      };

      const s = document.createElement('script');
      s.src = 'kitan.js';
      s.onerror = () => { showToast(MSG.JS_LOAD_FAIL, 5000); track('load_failed'); };
      document.body.appendChild(s);
    }
  </script>
  <script src="https://atah.io/footer.js" data-emulator></script>
